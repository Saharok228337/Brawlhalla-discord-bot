[project]
name = "brawlhalla-discord-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Saharok228337", email = "saharokok228337@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.7.1",
    "dotenv>=0.9.9",
    "requests>=2.34.2",
]

[project.scripts]
bot = "brawlhalla_discord_bot:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = ["ASYNC210", "F811"]
